name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mano1233/cs2-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest

  # One native runner per architecture instead of QEMU: the arm64 leg used to emulate
  # every instruction (aarch64 python and pip on an x86 host), which cost minutes per
  # build. Each leg pushes by digest; the merge job below stitches them into one tag.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Filename is the bare hash: artifact paths cannot contain a colon, and the
          # merge job puts the "sha256:" back when it builds the manifest.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # VERSION is the single source of truth for the published tag, so midgard's
      # Terraform can pin an exact image and a bump is one line in one place.
      - id: version
        run: echo "tag=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.version.outputs.tag }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.tag }}"

  # Tells midgard the tag exists, so its Image Bump workflow opens (or moves forward) the
  # PR that pins it. It authenticates as the midgard-bump GitHub App, whose one-hour
  # token is minted here and only reaches midgard. Until the app key is set this only
  # logs a notice: publishing the image never depends on midgard.
  notify-midgard:
    needs: merge
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.MIDGARD_BUMP_APP_KEY != '' && vars.MIDGARD_BUMP_APP_ID != '' && 'true' || 'false' }}
    steps:
      - name: Skip without the app
        if: env.HAS_APP_KEY == 'false'
        run: echo "::notice::MIDGARD_BUMP_APP_ID / MIDGARD_BUMP_APP_KEY are not set; midgard was not told about ${{ needs.merge.outputs.tag }}"

      - name: Get a midgard-bump token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MIDGARD_BUMP_APP_ID }}
          private-key: ${{ secrets.MIDGARD_BUMP_APP_KEY }}
          owner: mano1233
          repositories: midgard

      - name: Dispatch image-published to midgard
        if: env.HAS_APP_KEY == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.merge.outputs.tag }}
        run: |
          gh api "repos/mano1233/midgard/dispatches" \
            -f event_type=image-published \
            -f "client_payload[app]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[sha]=$GITHUB_SHA"
          echo "Asked midgard to pin ${GITHUB_REPOSITORY#*/} $TAG" >> "$GITHUB_STEP_SUMMARY"
